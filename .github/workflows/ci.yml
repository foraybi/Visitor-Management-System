name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run

  builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build and gate the kiosk
        run: |
          npm run build:kiosk
          npm run verify:kiosk

      - name: Build and gate the staff app
        run: |
          rm -rf dist
          npm run build:staff
          npm run verify:staff

      # The self-hosted server must keep building, or the move off Vercel breaks
      # silently.
      - name: Build the self-hosted server
        run: npm run build:server
