<!doctype html>
<!--
  lang and dir are set here rather than only in React. The app defaults to
  Arabic, but the document said lang="en" with no dir at all, so the first paint
  was left-to-right and then flipped once the effect ran.

  user-scalable=no and maximum-scale=1 are deliberate on a kiosk: pinch-zoom on
  an unattended tablet leaves the next visitor looking at a magnified corner of
  the form. This is the one context where suppressing zoom is the accessible
  choice, because nobody can restore it themselves.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#007297" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="زوار" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>زوار — نظام إدارة الزوار</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
